<!DOCTYPE html>

<html>
<head>
  
  <title>Apply-Kolonyama Training Institute</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>
    <h1>Kolonyama Training Institute</h1>
    <h2>Application Form</h2>
    <form>
      <label>Full Name:</label><br>
      <input type="text" name="Full name"><br><br>
      
      <label>Date Of Birth:</label><br>
      <input type="date" name="dob"><br><br>
      <label>Gender:</label><br>
      <input type="radio" name="gender" value="Male">
      <input type="radio" name="gender" value="Female"><br><br>
      <label>Email:</label><br>
      <input type="email" name="email"><br><br>
      <label>Address:</label><br>
      <textarea name="address" rows="4" cols="30"></textarea><br><br>
      <label>Select Course:</label><br>
      <select name="Course">
        <option value=""></option>
        <option>Business Administration</option>
        <option>Advanced Computer Skills</option>
        <option>Catering & Hospitality</option>
        <option>Carpentry</option>
        <option>Fashion & Design</option>
      </select><br><br>
      
      <label>Previous Qualification:</label><br><br>
      <input type="text" name="qualification"><br><br>
      <label>Why do you want to study at Kolonyama Training Institute</label><br>
      <textarea name="reason" rows="5" cols="40"></textarea><br><br>
      <input type="check box" name="agreement">
      I confirm that the information provided is correct.<br><br>
      <input type="submit" value="Submit Application">
      <input type="resert" value="clear">
      
    </form>
    <br>
    <a href="index.html"><button>home</button></a>
  </h1>
</body>
</html>
